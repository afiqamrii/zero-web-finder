services:
  - type: web
    name: zero-web-finder
    runtime: docker
    autoDeployTrigger: off
    healthCheckPath: /api/health
    region: singapore # Change to your preferred region (e.g. frankfurt, ohio, oregon, singapore)
    plan: free # For review only. Continuous automation needs an always-on instance.
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
