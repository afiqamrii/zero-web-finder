# Free online workspace. Automation runs only while this instance is awake.
# Pause discovery jobs before launch: Chromium capacity is unverified at 512 MB.
services:
  - type: web
    name: zero-web-finder
    runtime: docker
    repo: https://github.com/afiqamrii/zero-web-finder
    branch: codex/growth-launch
    autoDeployTrigger: off
    healthCheckPath: /api/health
    region: singapore
    plan: free
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
